# Local dev. Default `docker compose up` starts Postgres and n8n only.
# App containers start with: docker compose --profile apps up --build
services:
  postgres:
    image: pgvector/pgvector:pg16 # pgvector ready for Phase 2 RAG
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wsos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wsos_local}
      POSTGRES_DB: ${POSTGRES_DB:-wsos}
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wsos}" ]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      MOCK_MODE: "true"
      WHATSAPP_MOCK_MODE: "true"
      WHATSAPP_MODE: "mock"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-key-change-me}
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
    ports: [ "5678:5678" ]
    volumes: [ n8ndata:/home/node/.n8n ]

  api:
    profiles: [ apps ]
    build: { context: ., dockerfile: backend-nestjs-gateway/Dockerfile }
    env_file: backend-nestjs-gateway/.env
    ports: [ "3001:3001" ]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    profiles: [ apps ]
    build: { context: ., dockerfile: backend-worker/Dockerfile }
    env_file: backend-worker/.env
    depends_on: { postgres: { condition: service_healthy } }

  web:
    profiles: [ apps ]
    build: { context: ., dockerfile: frontend-nextjs/Dockerfile }
    env_file: frontend-nextjs/.env
    ports: [ "3000:3000" ]

volumes:
  pgdata:
  n8ndata:
