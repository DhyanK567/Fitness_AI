name: SL and ERPE verification

on:
  pull_request:
    paths:
      - 'backend-nestjs-gateway/**'
      - 'erpnext-custom-app/**'
      - 'shared/api-contracts/**'
      - 'tests/contract-erp-adapter/**'
      - '.github/workflows/sl-erpe-verify.yml'
  push:
    branches: ['**']
    paths:
      - 'backend-nestjs-gateway/**'
      - 'erpnext-custom-app/**'
      - 'shared/api-contracts/**'
      - 'tests/contract-erp-adapter/**'
      - '.github/workflows/sl-erpe-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_ai_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_ai_ci_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_ai_ci_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ERP JSON and Python source
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m compileall -q erpnext-custom-app/wellness_studio/wellness_studio
          python -m pytest tests/contract-erp-adapter -q
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify NestJS gateway
        working-directory: backend-nestjs-gateway
        run: |
          npx prisma validate
          npx prisma migrate deploy
          pnpm run typecheck
          pnpm run test
          pnpm run test:e2e
          pnpm run build
