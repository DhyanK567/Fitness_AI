Schedule:
  type: object
  required:
    - id
    - class_id
    - start_time
    - end_time
  properties:
    id:
      type: string
      readOnly: true
      description: Unique schedule identifier generated automatically by ERPNext
      example: SCH-00001

    class_id:
      type: string
      description: ID of the class associated with this schedule
      example: CLS-00001

    start_time:
      type: string
      format: date-time
      description: Scheduled class start time
      example: "2026-09-20T09:00:00Z"

    end_time:
      type: string
      format: date-time
      description: Scheduled class end time
      example: "2026-09-20T10:00:00Z"

    capacity:
      type: integer
      minimum: 1
      description: Maximum number of members allowed
      example: 20

    status:
      type: string
      enum:
        - scheduled
        - cancelled
        - completed
      description: Current schedule status
      example: scheduled


CreateScheduleRequest:
  type: object
  required:
    - class_id
    - start_time
    - end_time
  properties:
    class_id:
      type: string
      example: CLS-00001

    start_time:
      type: string
      format: date-time
      example: "2026-09-20T09:00:00Z"

    end_time:
      type: string
      format: date-time
      example: "2026-09-20T10:00:00Z"

    capacity:
      type: integer
      minimum: 1
      example: 20


UpdateScheduleRequest:
  type: object
  properties:
    start_time:
      type: string
      format: date-time
      example: "2026-09-20T09:00:00Z"

    end_time:
      type: string
      format: date-time
      example: "2026-09-20T10:00:00Z"

    capacity:
      type: integer
      minimum: 1
      example: 20

    status:
      type: string
      enum:
        - scheduled
        - cancelled
        - completed
      example: scheduled
