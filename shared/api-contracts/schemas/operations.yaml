Staff:
  type: object
  required: [id, name, roles, is_active, status]
  properties:
    id: {type: string, format: uuid, readOnly: true}
    name: {type: string}
    email: {type: string, format: email, nullable: true}
    phone: {type: string, nullable: true}
    roles: {type: array, items: {type: string, enum: [owner, admin, front_desk, trainer]}}
    is_active: {type: boolean}
    status: {type: string}
    erp_ref: {type: string, nullable: true}

CreateStaffRequest:
  type: object
  required: [full_name, email, role_codes]
  properties:
    full_name: {type: string, minLength: 2, maxLength: 160}
    email: {type: string, format: email, maxLength: 254}
    phone: {type: string, pattern: '^\\+[1-9][0-9]{7,14}$'}
    role_codes:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items: {type: string, enum: [owner, admin, front_desk, trainer]}

StaffStatusRequest:
  type: object
  required: [reason]
  properties:
    reason: {type: string, minLength: 3, maxLength: 500}

ReportResult:
  type: object
  properties:
    report_code: {type: string}
    period: {type: object, additionalProperties: true}
    columns: {type: array, items: {type: string}}
    rows: {type: array, items: {type: object, additionalProperties: true}}
    totals: {type: object, additionalProperties: true}
    generated_at: {type: string, format: date-time}

TenantSetting:
  type: object
  required: [key, value]
  additionalProperties: false
  properties:
    key: {type: string, pattern: '^[a-z][a-z0-9_.-]{1,99}$'}
    value: {description: JSON value configured for this tenant}

UpsertTenantSettingRequest:
  type: object
  required: [value]
  additionalProperties: false
  properties:
    value: {description: Non-null JSON value; serialized size is limited to 16 KiB}

ErpEventCallback:
  type: object
  required: [event_id, event_type, tenant_id, resource_type, resource_ref, payload]
  additionalProperties: false
  properties:
    event_id: {type: string, format: uuid}
    event_type: {type: string, minLength: 1, maxLength: 100}
    tenant_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}$'}
    resource_type: {type: string, minLength: 1, maxLength: 60}
    resource_ref: {type: string, minLength: 1, maxLength: 140}
    payload: {type: object, additionalProperties: true}

ErpHealth:
  type: object
  required: [status, app]
  additionalProperties: false
  properties:
    status: {type: string, enum: [ok]}
    app: {type: string, enum: [wellness_studio]}

ErpVersion:
  type: object
  required: [app, version]
  additionalProperties: false
  properties:
    app: {type: string, enum: [wellness_studio]}
    version: {type: string, pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'}
