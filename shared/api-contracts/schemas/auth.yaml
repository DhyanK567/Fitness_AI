StaffLoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email: { type: string, format: email, maxLength: 254 }
    password: { type: string, minLength: 1, maxLength: 128 }

StaffInviteRequest:
  type: object
  additionalProperties: false
  required: [email, displayName, roleCode]
  properties:
    email: { type: string, format: email, maxLength: 254 }
    displayName: { type: string, minLength: 2, maxLength: 160 }
    roleCode: { type: string, enum: [owner, admin, front_desk, trainer] }

AdminResetPasswordRequest:
  type: object
  additionalProperties: false
  required: [userId, password]
  properties:
    userId: { type: string, format: uuid }
    password: { type: string, minLength: 12, maxLength: 128 }

AcceptStaffInviteRequest:
  type: object
  additionalProperties: false
  required: [invite_token, password, full_name]
  properties:
    invite_token: { type: string, minLength: 32 }
    password: { type: string, minLength: 12, maxLength: 128 }
    full_name: { type: string, minLength: 2, maxLength: 160 }

ForgotPasswordRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email: { type: string, format: email, maxLength: 254 }

CompletePasswordResetRequest:
  type: object
  additionalProperties: false
  required: [token, new_password]
  properties:
    token: { type: string, minLength: 32 }
    new_password: { type: string, minLength: 12, maxLength: 128 }

ChangePasswordRequest:
  type: object
  additionalProperties: false
  required: [current_password, new_password]
  properties:
    current_password: { type: string, minLength: 1, maxLength: 128 }
    new_password: { type: string, minLength: 12, maxLength: 128 }

RefreshTokenRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token: { type: string, minLength: 32 }

LogoutRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token: { type: string, minLength: 32 }
    all_sessions: { type: boolean }

GoogleIdTokenRequest:
  type: object
  additionalProperties: false
  required: [id_token]
  properties:
    id_token: { type: string, minLength: 20, maxLength: 8192 }

MemberOtpRequest:
  type: object
  additionalProperties: false
  required: [phone, purpose]
  properties:
    phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
    purpose: { type: string, enum: [login, register, link] }

MemberOtpVerifyRequest:
  type: object
  additionalProperties: false
  required: [challenge_id, otp]
  properties:
    challenge_id: { type: string, format: uuid }
    otp: { type: string, pattern: '^[0-9]{6}$' }
    full_name: { type: string, minLength: 2, maxLength: 160 }
    email: { type: string, format: email, maxLength: 254 }

AuthTokenResponse:
  type: object
  required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
  properties:
    access_token: { type: string }
    access_expires_at: { type: string, format: date-time }
    refresh_token: { type: string }
    refresh_expires_at: { type: string, format: date-time }
