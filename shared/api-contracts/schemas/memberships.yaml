CreateMembershipRequest:
  type: object
  required:
    - member_id
    - plan_name
    - plan_type
    - start_date
    - end_date
    - price
    - auto_renew
  properties:
    member_id:
      type: string
      description: ID of the member associated with this membership
      example: MEM-0001

    plan_name:
      type: string
      description: Name of the membership plan
      example: Premium Fitness Plan

    plan_type:
      type: string
      enum:
        - monthly
        - quarterly
        - annual
      example: monthly

    start_date:
      type: string
      format: date
      example: "2026-09-18"

    end_date:
      type: string
      format: date
      example: "2026-10-18"

    price:
      type: number
      format: float
      minimum: 0
      example: 1500

    auto_renew:
      type: boolean
      example: true


UpdateMembershipRequest:
  type: object
  properties:
    plan_name:
      type: string
      example: Premium Fitness Plan

    plan_type:
      type: string
      enum:
        - monthly
        - quarterly
        - annual
      example: monthly

    start_date:
      type: string
      format: date
      example: "2026-09-18"

    end_date:
      type: string
      format: date
      example: "2026-10-18"

    price:
      type: number
      format: float
      minimum: 0
      example: 1500

    auto_renew:
      type: boolean
      example: true


MembershipResponse:
  type: object
  required:
    - id
    - member_id
    - plan_name
    - plan_type
    - start_date
    - end_date
    - status
    - price
    - auto_renew
  properties:
    id:
      type: string
      description: Unique membership ID generated by the backend/ERPNext
      example: MSHP-0012

    member_id:
      type: string
      description: ID of the associated member
      example: MEM-0001

    plan_name:
      type: string
      example: Premium Fitness Plan

    plan_type:
      type: string
      enum:
        - monthly
        - quarterly
        - annual
      example: monthly

    start_date:
      type: string
      format: date
      example: "2026-09-18"

    end_date:
      type: string
      format: date
      example: "2026-10-18"

    status:
      type: string
      enum:
        - pending
        - active
        - expired
        - suspended
        - cancelled
      example: active

    price:
      type: number
      format: float
      example: 1500

    auto_renew:
      type: boolean
      example: true
MembershipPlan:
  type: object
  required: [name, plan_name, plan_type, price, validity_days]
  properties:
    name: {type: string, readOnly: true}
    plan_name: {type: string}
    plan_type: {type: string, enum: [Basic, Premium, Custom]}
    price: {type: number, minimum: 0}
    validity_days: {type: integer, minimum: 1}
    allowed_bookings_per_week: {type: integer, minimum: 0}
    description: {type: string, nullable: true}

CreateOwnMembershipRequest:
  type: object
  additionalProperties: false
  required: [plan_name, plan_type, start_date, end_date, price, auto_renew]
  properties:
    plan_name: {type: string, minLength: 1, maxLength: 140}
    plan_type: {type: string, enum: [monthly, quarterly, annual]}
    start_date: {type: string, format: date}
    end_date: {type: string, format: date}
    price: {type: number, minimum: 0.01, maximum: 10000000}
    auto_renew: {type: boolean}
