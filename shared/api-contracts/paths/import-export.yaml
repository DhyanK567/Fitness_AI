/import-export/export/{dataset}:
  get:
    tags:
      - Import / Export
    summary: Export a dataset as JSON or CSV
    operationId: exportDataset
    security:
      - bearerAuth: []
    parameters:
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          enum: [members, leads, classes, memberships, bookings, attendance, payments, events]
      - name: format
        in: query
        schema:
          type: string
          enum: [json, csv, xlsx]
          default: json
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - name: from
        in: query
        schema:
          type: string
          example: 2026-01-01
      - name: to
        in: query
        schema:
          type: string
          example: 2026-12-31
      - name: status
        in: query
        schema:
          type: string
          example: Active
    responses:
      '200':
        description: Exported dataset
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                count:
                  type: integer
                format:
                  type: string
      '400':
        description: Invalid parameters
      '401':
        description: User not authenticated
      '403':
        description: User does not have permission
      '404':
        description: Dataset not supported
