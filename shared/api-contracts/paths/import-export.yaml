/import-export/import/members:
  post:
    tags:
      - Import / Export
    summary: Import member records from CSV/Excel or JSON rows
    operationId: importMembers
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rows
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Divya Krishnan
                    email:
                      type: string
                      format: email
                      example: divya.k@example.com
                    phone:
                      type: string
                      example: 9845091122
                    plan:
                      type: string
                      enum: [Basic, Premium, Ultra Premium]
                      example: Premium
                    status:
                      type: string
                      enum: [Active, Review, Paused, Frozen, Inactive]
                      example: Active
                    joined:
                      type: string
                      example: 3/20/2026
                    expiry:
                      type: string
                      example: 12/20/2026
                    coach:
                      type: string
                      example: Ananya Sharma
              dryRun:
                type: boolean
                example: false
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
              dryRun:
                type: boolean
    responses:
      '200':
        description: Import completed
        content:
          application/json:
            schema:
              type: object
              properties:
                created:
                  type: integer
                  example: 2
                updated:
                  type: integer
                  example: 0
                skipped:
                  type: integer
                  example: 0
                failed:
                  type: integer
                  example: 0
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      row:
                        type: integer
                      field:
                        type: string
                      message:
                        type: string
      '400':
        description: Invalid input or validation errors
      '401':
        description: User not authenticated
      '403':
        description: User does not have permission
      '413':
        description: File too large

